<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Despesas">
<meta name="theme-color" content="#1A232F">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Receitas e Despesas</title>
<style>
  @font-face{font-family:"Source Serif 4";font-style:normal;font-weight:600 700;font-display:swap;src:url(fonte.woff2) format("woff2")}
  :root{
    --navy:#1A232F; --red:#C83028; --bg:#EEF1F5; --card:#FFFFFF; --ink:#1A232F; --muted:#5E6B7A; --line:#E2E7EE; --azul:#4A6FA5;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg)}
  body{color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:15px}
  h2,.serif{font-family:"Source Serif 4",Georgia,serif}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--card);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(26,35,47,.08)}
  .barra{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;position:sticky;top:0;z-index:5}
  .barra .nav{display:flex;justify-content:space-between;align-items:center;font-size:14px;min-height:22px}
  .barra .nav button,.barra .nav select{color:#fff;opacity:.9;font-size:14px;padding:4px 0}
  .barra select{background:transparent;border:0;appearance:none;-webkit-appearance:none;text-align:right}
  .barra select option{color:#000}
  .barra h2{font-size:22px;margin-top:6px;line-height:1.2;word-break:break-word}
  .barra .sub{font-size:13px;opacity:.75;margin-top:3px}
  .conteudo{padding:16px 16px calc(28px + env(safe-area-inset-bottom));flex:1;display:flex;flex-direction:column;gap:14px}

  .kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .kpi{border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
  .kpi small{display:block;font-size:11px;color:var(--muted)}
  .kpi strong{display:block;font-size:18px;margin-top:4px;font-family:"Source Serif 4",Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi.desp strong{color:var(--red)}
  .kpi.sobra{background:var(--navy);border-color:var(--navy);color:#fff} .kpi.sobra small{color:#C9D2DE}
  .kpi.neg{background:var(--red);border-color:var(--red)}
  .frase{font-size:13.5px} .frase b{color:var(--red)} .frase b.ok{color:var(--navy)}
  .fonte{font-size:11px;color:var(--muted)}
  .vazio{text-align:center;color:var(--muted);font-size:14px;padding:24px 12px;border:1px dashed var(--line);border-radius:14px;line-height:1.5}
  .aviso{background:#FFF4E5;border:1px solid #F3C98B;color:#7A4B00;font-size:13px;padding:10px 12px;border-radius:12px;line-height:1.4}
  .erro{background:#FDECEA;border:1px solid #F2B8B3;color:#8A1F17;font-size:13.5px;padding:12px;border-radius:12px;line-height:1.45}

  .job{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;background:#fff}
  .job:active{background:#F6F8FB}
  .job .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .job .nome{font-weight:bold;font-size:15.5px;word-break:break-word}
  .job .nome small{display:block;font-weight:normal;color:var(--muted);font-size:12.5px;margin-top:2px}
  .st{font-size:11px;padding:3px 8px;border-radius:20px;white-space:nowrap}
  .st.aberto{background:#E8EEF7;color:var(--azul)} .st.fechado{background:#EEF1F5;color:var(--muted)}
  .nums{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:11.5px;color:var(--muted);gap:4px}
  .nums b{display:block;font-size:14.5px;color:var(--ink);margin-top:2px}
  .nums .r b{color:var(--red)} .nums .n b{color:var(--red)}
  .trilho{height:10px;background:#F1F3F6;border-radius:6px;overflow:hidden}
  .trilho i{display:block;height:100%;border-radius:6px;background:var(--navy)}
  .trilho i.alto{background:var(--red)}
  .pct{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
  .pct b{color:var(--ink)} .pct .alerta{color:var(--red);font-weight:bold}
  .novo{border:2px dashed var(--red);color:var(--red);border-radius:14px;text-align:center;padding:14px;font-weight:bold;font-size:15px;width:100%}

  .barras{border:1px solid var(--line);border-radius:12px;padding:12px}
  .linha-barra{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:6px 0}
  .linha-barra span:first-child{width:70px;color:var(--muted)}
  .linha-barra .trilho{flex:1;height:14px;border-radius:7px}
  .rosca{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
  .itens{width:100%;font-size:13.5px}
  .item{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
  .item:last-child{border-bottom:0}
  .item i{width:10px;height:10px;border-radius:3px}
  .item em{font-style:normal;color:var(--muted)}
  .item b{min-width:46px;text-align:right}
  .botao-grande{background:var(--red);color:#fff;text-align:center;padding:15px;border-radius:14px;font-weight:bold;font-size:16px;width:100%}
  .titulo-sec{display:flex;justify-content:space-between;align-items:center}
  .titulo-sec h3{font-size:14.5px}
  .titulo-sec span{font-size:12px;color:var(--muted)}
  .swipe{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
  .swipe .del-btn{position:absolute;top:0;bottom:0;width:96px;background:var(--red);color:#fff;font-weight:bold;font-size:14px}
  .swipe .del-esq{left:0} .swipe .del-dir{right:0}
  .swipe .lanc{position:relative;z-index:1;touch-action:pan-y;user-select:none;-webkit-user-select:none}
  .lanc{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:9px 0;width:100%;text-align:left;background:#fff}
  .mini{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#e4e8ee,#cdd3dc);display:grid;place-items:center;font-size:19px;overflow:hidden}
  .mini img{width:100%;height:100%;object-fit:cover}
  .lanc p{font-size:14px;min-width:0;word-break:break-word}
  .lanc p small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .lanc .val{font-weight:bold;font-size:14.5px;color:var(--red);white-space:nowrap}
  .pend{color:#B26A00 !important}
  .exportar{display:block;border:1px dashed var(--muted);border-radius:12px;text-align:center;padding:12px;font-size:14px;color:var(--muted);text-decoration:none}

  .foto{position:relative;min-height:200px;border-radius:14px;background:linear-gradient(135deg,#e4e8ee,#cdd3dc);display:grid;place-items:center;overflow:hidden}
  .foto img{width:100%;max-height:340px;object-fit:contain;background:#222;display:block}
  .foto .tirar{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--navy);font-weight:bold;padding:30px;font-size:16px}
  .foto .tirar span{font-size:44px}
  .foto .dois{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;padding:14px}
  .foto .dois .tirar{padding:22px 8px;background:#fff;border-radius:14px;font-size:15px}
  .trocar-box{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
  .kpi em.pc,.sqft em.pc{display:block;font-style:normal;font-size:12px;font-weight:bold;margin-top:2px;color:var(--muted)}
  .kpi.sobra em.pc,.sqft .l em.pc{color:#C9D2DE}
  .foto .trocar{background:rgba(26,35,47,.85);color:#fff;font-size:12px;padding:7px 11px;border-radius:20px}
  .lendo{position:absolute;inset:0;background:rgba(26,35,47,.55);color:#fff;display:grid;place-items:center;font-weight:bold}
  .mic{display:flex;align-items:center;gap:12px;border:2px solid var(--red);border-radius:14px;padding:12px;background:#FFF6F5}
  .mic button{flex:0 0 54px;height:54px;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 0 0 6px rgba(200,48,40,.18)}
  .mic button.ouvindo{animation:pulsar 1s infinite}
  @keyframes pulsar{50%{box-shadow:0 0 0 12px rgba(200,48,40,.08)}}
  .mic .txt{flex:1;min-width:0}
  .mic small{display:block;color:var(--red);font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:.05em}
  .mic textarea{width:100%;border:0;background:transparent;resize:none;font-size:15.5px;margin-top:3px;outline:none;min-height:44px}
  .dica-mic{font-size:12px;color:var(--muted);margin-top:-6px}
  .campo{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:block}
  .campo small{display:block;font-size:11.5px;color:var(--muted)}
  .campo input{width:100%;border:0;outline:none;font-size:17px;margin-top:4px;background:transparent;min-width:0}
  .campo input.grande{font-size:26px;font-family:"Source Serif 4",Georgia,serif;font-weight:700}
  .campo .linha{display:flex;align-items:center;gap:6px}
  .tag{font-size:10.5px;background:#EEF1F5;color:var(--muted);padding:3px 8px;border-radius:20px;white-space:nowrap}
  .tag.ok{background:#E8EEF7;color:var(--azul)} .tag.ruim{background:#FDECEA;color:var(--red)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
  .chip{font-size:13.5px;padding:8px 12px;border-radius:20px;border:1px solid var(--line);background:#fff}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.mais{border-style:dashed;color:var(--red);border-color:var(--red)}
  .dupla{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
  .dupla>*{min-width:0}
  .campo input[type=date]{min-width:0;width:100%;max-width:100%}
  .salvar{background:var(--red);color:#fff;text-align:center;padding:16px;border-radius:14px;font-weight:bold;font-size:16px;width:100%;margin-top:4px}
  .salvar:disabled{opacity:.5}
  .excluir{color:var(--red);font-size:14px;padding:10px;text-align:center;width:100%}
  .dica{font-size:12px;color:var(--muted);text-align:center}
  .ajuda{background:#F6F8FB;border-radius:12px;padding:12px;font-size:13px;color:var(--muted);line-height:1.5}

  .veiculo{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
  .vcab{display:flex;gap:10px;align-items:center} .vcab b{font-size:15px}
  .vico{width:40px;height:40px;border-radius:10px;background:#EEF1F5;display:grid;place-items:center;font-size:22px;flex:0 0 40px}
  .calc{font-size:12.5px;color:var(--muted)} .calc b{color:var(--ink)}
  .regra{font-size:12.5px;background:#F6F8FB;border-radius:8px;padding:7px 9px}
  .novo-campo{border-left:4px solid var(--red)}
  .mapa{font-size:12px;color:var(--azul);border:1px solid #C9D6EA;padding:5px 10px;border-radius:20px;white-space:nowrap;text-decoration:none}
  .stepper{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
  .stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);color:var(--red);font-weight:bold;font-size:18px}
  .stepper b{font-size:18px}
  .bloco{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
  .tlin{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
  .tlin span{color:var(--muted)} .tlin.total{border-bottom:0;font-size:14px} .tlin.total span{color:var(--ink);font-weight:bold} .tlin.total b{color:var(--red)}
  .sqft{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
  .sqft div{background:#F6F8FB;border-radius:10px;padding:8px 4px;min-width:0}
  .sqft small{display:block;font-size:11px;color:var(--muted)} .sqft b{display:block;font-size:18px;font-family:"Source Serif 4",Georgia,serif;margin:2px 0}
  .sqft b.r{color:var(--red)} .sqft em{font-style:normal;font-size:10.5px;color:var(--muted)}
  .sqft .l{background:var(--navy);color:#fff} .sqft .l small,.sqft .l em{color:#C9D2DE} .sqft .l.neg{background:var(--red)}
  .frase b.ok{color:var(--navy)}
  .engrenagem{font-size:20px !important;opacity:1 !important;padding:0 2px !important}
  .idiomas{display:flex;flex-direction:column;gap:12px;margin-top:6px}
  .idioma{display:flex;align-items:center;gap:14px;border:2px solid var(--line);border-radius:16px;padding:16px;background:#fff;text-align:left;width:100%}
  .idioma.on{border-color:var(--red);background:#FFF6F5}
  .idioma .bandeira{font-size:34px;line-height:1}
  .idioma b{font-size:18px;display:block} .idioma small{color:var(--muted);font-size:13px}
  .idioma .marca{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:0 0 26px}
  .idioma.on .marca{background:var(--red);border-color:var(--red);box-shadow:inset 0 0 0 5px #fff}
  .grande-titulo{font-family:"Source Serif 4",Georgia,serif;font-size:24px;line-height:1.25}
  .nota{font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
  .marca-emp{display:inline-flex;align-items:center;gap:8px;font-size:14px}
  .marca-emp img{width:26px;height:26px;border-radius:7px;background:#fff;object-fit:contain}
  .secao-t{font-size:13px;font-weight:bold;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
  .calc-linha{background:#F6F8FB;border-radius:10px;padding:9px 11px;font-size:13px;color:var(--muted);line-height:1.5}
  .calc-linha b{color:var(--ink)}
  .grade2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .met{border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
  .met small{display:block;font-size:11px;color:var(--muted)}
  .met b{display:block;font-size:20px;font-family:"Source Serif 4",Georgia,serif;margin:3px 0}
  .met em{font-style:normal;font-size:11px;color:var(--muted)}
  .met.destaque{background:var(--navy);border-color:var(--navy);color:#fff} .met.destaque small,.met.destaque em{color:#C9D2DE}
  .met.r b{color:var(--red)}
  .media{border:2px solid var(--navy);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
  .media h3{font-size:14px}
  .media .linha2{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-bottom:1px dashed var(--line);padding:4px 0}
  .media .estim{background:#FFF6F5;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45}
  .minijob{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:2px}
  .logo-linha{display:flex;gap:14px;align-items:center;margin-top:8px}
  .logo-prev{flex:0 0 76px;height:76px;border-radius:16px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;font-size:30px}
  .logo-prev img{width:100%;height:100%;object-fit:contain}
  .logo-acoes{display:flex;flex-direction:column;gap:8px;flex:1}
  .btn-peq{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:13.5px;background:#fff;width:100%}
  .btn-peq.rm{color:var(--red);border-color:#F2B8B3}
  .topo-prev{background:var(--navy);color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px}
  .topo-prev .l{width:34px;height:34px;border-radius:9px;background:#fff;display:grid;place-items:center;flex:0 0 34px;overflow:hidden}
  .topo-prev .l img{width:100%;height:100%;object-fit:contain}
  .topo-prev b{font-size:15px;line-height:1.2} .topo-prev small{display:block;opacity:.75;font-size:11.5px}
  .menu-lista{border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .menu-item{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line);background:#fff;width:100%;text-align:left}
  .menu-item:last-child{border-bottom:0}
  .menu-item .ic{width:38px;height:38px;border-radius:10px;background:#EEF1F5;display:grid;place-items:center;font-size:19px;flex:0 0 38px}
  .menu-item b{display:block;font-size:15px} .menu-item small{display:block;color:var(--muted);font-size:12px;margin-top:2px;word-break:break-word}
  .menu-item .seta2{margin-left:auto;color:var(--muted);font-size:20px}
  .menu-item.perigo b{color:var(--red)} .menu-item.perigo .ic{background:#FDECEA}
  .pill-setup{border:1px solid rgba(255,255,255,.55);border-radius:20px;padding:4px 12px;color:#fff;font-size:13px}
  .filtro-sel{border:1px solid var(--line);border-radius:20px;padding:6px 12px;background:#fff;font-size:13px;color:var(--muted)}
  .promessa{background:#F6F8FB;border-radius:12px;padding:12px;font-size:13px;line-height:1.55;color:var(--muted)} .promessa b{color:var(--ink)}
  .check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);line-height:1.45}
  .check input{flex:0 0 22px;width:22px;height:22px;margin-top:1px}
  .perigo-box{border:2px solid var(--red);border-radius:14px;padding:12px;background:#FFF6F5;font-size:13px;line-height:1.5} .perigo-box b{color:var(--red)}
  .lista-x{margin:4px 0 0 18px;color:var(--ink);line-height:1.6}
  .btn-ghost{display:block;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:14px;background:#fff;color:var(--ink);text-decoration:none;width:100%}
  .salvar.perigo{background:#8A1F17}
  .arq{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px} .arq:last-of-type{border-bottom:0}
  .arq code,.calc-linha code{background:#EEF1F5;border-radius:6px;padding:2px 7px;font-size:12px;word-break:break-all} .arq span{color:var(--muted);font-size:12px}
  .tog{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .erro-campo{color:#B3261E;font-size:13px;line-height:1.35;margin:6px 2px 0}
  .campo.invalido{border-color:#C83028;box-shadow:0 0 0 2px rgba(200,48,40,.15)}
  .caixa-erro{background:#FDECEA;border:1px solid #F3B6B1;border-radius:14px;padding:12px 14px;margin:0 0 12px;color:#8A1F17;font-size:14px}
  .caixa-erro b{display:block;margin-bottom:4px}.caixa-erro ul{margin:0;padding-left:18px}
  .job-val{background:#fff;border:1px solid var(--line,#E3E8EE);border-radius:16px;padding:12px 14px;margin-bottom:12px}
  .olho{position:absolute;right:6px;bottom:6px;width:40px;height:40px;border:0;background:transparent;font-size:20px;cursor:pointer;border-radius:10px}
  .tem-olho{position:relative}.tem-olho input{padding-right:48px}
  .tog-lista .tog{padding:14px 2px;border-bottom:1px solid var(--line,#E3E8EE)}.tog-lista .tog:last-child{border-bottom:0}
  .tog-lista input[type=checkbox]{width:26px;height:26px;flex:none}
  .logo-grande{width:84px;height:84px;border-radius:18px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;margin:6px auto 0;font-size:34px;overflow:hidden}
  .logo-grande img{width:100%;height:100%;object-fit:contain}
  .nome-grande{text-align:center;font-family:"Source Serif 4",Georgia,serif;font-size:20px;font-weight:700}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:24px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:20;max-width:90vw;text-align:center}
  .selo{text-align:center;font-size:11px;color:var(--muted);padding:6px 0 4px}
  .selo span{border:1px solid var(--line);background:#fff;padding:4px 10px;border-radius:20px}
</style>
</head>

async function api(caminho, corpo) {
  let r, j;
  if (LOCAL) {   // o "servidor" roda dentro do aparelho (rd-local.js)
    try { j = await window.RD_LOCAL(caminho, corpo); r = {ok: true, status: 200}; }
    catch (e) { j = {erro: e.message}; r = {ok: false, status: e.http || 400}; }
  } else {
    r = await fetch(caminho, corpo ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(corpo)} : {cache: "no-store"});
    j = await r.json().catch(() => ({}));
  }
  if (!r.ok) {
    if (r.status === 401 && j.erro === "Entre com a senha" && S.estado && S.estado.logado) { // a sessão acabou: volta para a tela de senha
      S.estado = {...S.estado, logado: false}; try { localStorage.setItem("rd-logado", ""); } catch {} render();
    }
    const e = new Error(erroSrv(j.erro) || "erro " + r.status); e.http = r.status; throw e;
  }
  return j;
}

async function carregar() {
  try {
    const d = await api("/api/lancamentos");
    S.jobs = d.jobs; S.lancamentos = d.lancamentos; S.config = d.config || CONFIG_VAZIA; S.atualizado = d.atualizado; S.offline = false;
    try { localStorage.setItem("rd-cache", JSON.stringify(d)); } catch {}
  } catch (er) {
    if (er && er.http === 401) { S.carregou = true; return; }
    S.offline = true;
    try { const c = JSON.parse(localStorage.getItem("rd-cache") || "null"); if (c && !S.carregou) { S.jobs = c.jobs; S.lancamentos = c.lancamentos; S.config = c.config || CONFIG_VAZIA; S.atualizado = c.atualizado; } } catch {}
  }
  S.carregou = true;
  S.pendentes = lerFila();
}

async function enviarFila() {
  let fila = lerFila(); if (!fila.length) return;
  const resto = [];
  for (const p of fila) {
    try { await api(p.caminho, p.corpo); }
    catch (e) { if (e.http && e.http < 500 && e.http !== 401) continue; resto.push(p); } // erro de dado: descarta; sem rede: tenta depois
  }
  gravarFila(resto);
  if (resto.length < fila.length) { await carregar(); render(); toast(t("t_enviados", {n: fila.length - resto.length})); }
}

function despesasDo(jobId) {
  const enviadas = S.lancamentos.filter(l => l.job_id === jobId);
  const pend = S.pendentes.filter(p => p.caminho === "/api/lancamento" && p.corpo.job_id === jobId && !enviadas.some(l => l.id === p.corpo.id))
    .map(p => ({...p.corpo, valor: numero(p.corpo.valor), pendente: true, fotoLocal: p.corpo.foto}));
  return [...enviadas, ...pend].sort((a, b) => (b.data + (b.criado || "")).localeCompare(a.data + (a.criado || "")));
}
const ITEM_TRUCK = "Truck (estimativa)";
const precoGal = n => "$" + (Number(n) || 0).toFixed(3);
function precoDe(k) { return S.config.veiculos[k].gasolina || S.config.gasolina; }
function custoMilha(k) { const v = S.config.veiculos[k]; return (v.mpg ? precoDe(k) / v.mpg : 0) + v.outros; }
function truckDe(job) {
  const mi = job.milhas || 0, miD = (job.idas_dono || 0) * 2 * mi, miW = (job.dias_work || 0) * 2 * mi;
  const dono = miD * custoMilha("dono"), work = miW * custoMilha("work");
  const faltaConfig = (miD && !S.config.veiculos.dono.mpg) || (miW && !S.config.veiculos.work.mpg) || ((miD && !precoDe("dono")) || (miW && !precoDe("work")));
  return {mi, miD, miW, dono, work, total: dono + work, faltaConfig};
}
function resumo(job) {
  const ds = despesasDo(job.id), truck = truckDe(job);
  const gasto = ds.reduce((s, l) => s + l.valor, 0) + truck.total;
  const porItem = {};
  ds.forEach(l => porItem[l.item] = (porItem[l.item] || 0) + l.valor);
  if (truck.total) porItem[ITEM_TRUCK] = truck.total;
  const itens = Object.entries(porItem).sort((a, b) => b[1] - a[1]);
  return {ds, gasto, truck, sobrou: job.receita - gasto, taxa: job.receita ? gasto / job.receita : (gasto ? 1 : 0), itens};
}
function todosItens() {
  const usados = S.lancamentos.map(l => l.item);
  return [...new Set([...ITENS_PADRAO, ...usados, ...(form?.extras || [])])];
}
function adivinhar(texto) {
  const txt = " " + sem(texto) + " ";
  let melhor = null, pos = Infinity;
  for (const nome of todosItens()) {
    for (const cand of new Set([nome, disp(nome)])) { const i = txt.indexOf(sem(cand)); if (nome !== "Outros" && i >= 0 && i < pos) { melhor = nome; pos = i; } }
  }
  for (const [nome, chaves] of PALAVRAS) for (const k of chaves) { const i = txt.indexOf(k); if (i >= 0 && i < pos) { melhor = nome; pos = i; } }
  return melhor;
}

// média dos jobs com horas: produtividade e estimativa para o próximo estimate
function cartaoMedia() {
  const com = S.jobs.filter(j => horasTot(j) > 0).map(j => ({j, h: horasTot(j), r: resumo(j)}));
  if (!com.length) return "";
  const soma = (a, f) => a.reduce((s, x) => s + f(x), 0);
  const H = soma(com, x => x.h), R = soma(com, x => x.j.receita), L = soma(com, x => x.r.sobrou);
  const sq = com.filter(x => x.j.sqft > 0), Hs = soma(sq, x => x.h), Ss = soma(sq, x => x.j.sqft);
  const pes = Math.max(1, Math.round(soma(com, x => x.j.pessoas) / com.length)), hd = Math.round(soma(com, x => x.j.horas_dia) / com.length * 2) / 2 || 8;
  const lin = (rot, v) => `<div class="linha2"><span>${rot}</span><b>${v}</b></div>`;
  let estim = "";
  if (Hs > 0) { const horas = Math.round(Hs / Ss * 2000), dias = Math.max(1, Math.round(horas / (pes * hd))); estim = `<div class="estim">${t("media_estim", {s: "2,000", h: fmtH(horas), d: dias, p: pes, hd: fmtH(hd)})}</div>`; }
  return `<div class="media"><h3>${t("media_t", {n: com.length})}</h3>
    ${Hs > 0 ? lin(t("met_hsq"), numFmt(Hs / Ss, 3) + " h") + lin(t("met_sqh"), numFmt(Ss / Hs, 1) + " sq ft") : ""}
    ${R > 0 ? lin(t("met_price_h"), dinheiro(R / H)) + lin(t("met_lucro_h"), dinheiro(L / H)) : ""}
    ${estim}<p class="fonte">${t("media_fonte")}</p></div>`;
}

const COR_LUCRO = "#C9D6EA";
// 100% = valor do trabalho: cada despesa e o lucro (o que sobrou) são partes desse valor
function rosca(fatias, base, centro, rotulo) {
  let acc = 0;
  const arcos = fatias.map(([, v, cor]) => {
    const p = Math.max(0, v) / base * 100; if (p <= 0) return "";
    const a = `<circle cx="80" cy="80" r="62" pathLength="100" stroke="${cor}" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${-acc}"/>`;
    acc += p; return a;
  }).join("");
  return `<svg viewBox="0 0 160 160" width="150" height="150" role="img" aria-label="${t("aria_rosca")}">
    <g transform="rotate(-90 80 80)" fill="none" stroke-width="26">${arcos}</g>
    <text x="80" y="74" text-anchor="middle" font-size="10" fill="#5E6B7A">${rotulo}</text>
    <text x="80" y="96" text-anchor="middle" font-size="${centro >= 100000 ? 16 : 20}" font-weight="700" fill="#1A232F" font-family="Source Serif 4, Georgia, serif">${dinheiro(centro, false)}</text></svg>`;
}

    if (!(numero(String(f.receitaJob || "").replace(",", ".")) >= 0) || String(f.receitaJob || "").trim() === "") e.push({campo: "receita-job", msg: t("d_err_job_val")});

async function comprimir(arquivo) {
  const url = URL.createObjectURL(arquivo);
  try {
    const img = await new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = erro; i.src = url; });
    const max = 1600, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.82);
  } finally { URL.revokeObjectURL(url); }
}

async function fotoEscolhida(arquivo) {
  if (!arquivo || !form) return;
  form.foto = await comprimir(arquivo); form.fotoUrl = null; form.leitura = "lendo"; render();
  try {
    const r = await api("/api/ler-recibo", {foto: form.foto});
    if (!form) return;
    if (r.valor) { form.valor = r.valor.toFixed(2); form.leitura = "ok"; } else form.leitura = "falhou";
    if (r.loja) form.loja = r.loja;
    if (!form.itemManual) form.item = adivinhar(form.descricao + " " + form.loja) || form.item;
  } catch { if (form) form.leitura = "falhou"; }
  render();
}

let reconhecedor = null;
function falar() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const caixa = document.getElementById("descricao");
  const dica = () => { document.getElementById("dica-mic").hidden = false; caixa.focus(); };
  if (!SR) return dica();
  if (reconhecedor) { reconhecedor.stop(); return; }
  try {
    reconhecedor = new SR(); reconhecedor.lang = LANGS[LANG].fala; reconhecedor.interimResults = true; reconhecedor.continuous = false;
    const botao = document.getElementById("falar"); botao.classList.add("ouvindo");
    document.getElementById("mic-rotulo").textContent = t("ouvindo");
    reconhecedor.onresult = e => {
      const texto = [...e.results].map(r => r[0].transcript).join(" ");
      caixa.value = texto; form.descricao = texto; document.getElementById("mic-rotulo").textContent = t("voce_falou");
      if (!form.itemManual) atualizarItem();
    };
    reconhecedor.onerror = () => { reconhecedor = null; botao.classList.remove("ouvindo"); dica(); };
    reconhecedor.onend = () => { reconhecedor = null; botao.classList.remove("ouvindo"); };
    reconhecedor.start();
  } catch { reconhecedor = null; dica(); }
}

function validarInstalar(f) {

  if (f.senha && f.senha.length < 8) return {ok: false, msg: t("senha_curta"), erro: true};
  if (f.senha.length < 8) return {ok: false, msg: "", erro: false};
  if (f.senha !== f.senha2) return {ok: false, msg: f.senha2 ? t("senhas_dif") : "", erro: !!f.senha2};
  return {ok: f.aceito, msg: t("senhas_ok"), erro: false};

async function logoEscolhido(arq) {
  if (!arq) return;
  try {
    const campo = document.getElementById("emp-nome"); if (campo && form) form.nome = campo.value;
    const url = URL.createObjectURL(arq);
    const img = await new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = erro; i.src = url; });
    const k = Math.min(1, 512 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    const emp = await api("/api/logo", {foto: c.toDataURL("image/png")});
    S.config.empresa = {...S.config.empresa, ...emp}; toast(t("t_logo")); render();

// ---------- deslizar a despesa para o lado: mostra Excluir ----------
const LARG_DEL = 96;
let swipeAberto = null;
function fecharSwipe() { if (swipeAberto) { swipeAberto.style.transition = "transform .2s"; swipeAberto.style.transform = "translateX(0)"; swipeAberto = null; } }
function ligarSwipe() {
  document.querySelectorAll(".swipe").forEach(w => {
    const row = w.querySelector(".lanc");
    let x0 = null, y0 = null, base = 0, movendo = false, bloquearClique = false;
    const atual = () => (row === swipeAberto ? (parseFloat((row.style.transform.match(/-?[\d.]+/) || [0])[0]) || 0) : 0);
    row.addEventListener("pointerdown", e => { x0 = e.clientX; y0 = e.clientY; movendo = false; bloquearClique = false; base = atual(); if (swipeAberto && swipeAberto !== row) fecharSwipe(); });
    row.addEventListener("pointermove", e => {
      if (x0 === null) return;
      const dx = e.clientX - x0, dy = e.clientY - y0;
      if (!movendo) { if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) { movendo = true; try { row.setPointerCapture(e.pointerId); } catch {} } else return; }
      row.style.transition = "none";
      const lo = base > 0 ? 0 : -LARG_DEL, hi = base < 0 ? 0 : LARG_DEL; // linha aberta: o gesto contrário só fecha
      row.style.transform = `translateX(${Math.max(lo, Math.min(hi, base + dx))}px)`;
    });
    const soltar = () => {
      if (x0 === null) return;
      if (movendo) {
        bloquearClique = true;
        const v = parseFloat((row.style.transform.match(/-?[\d.]+/) || [0])[0]) || 0;
        if (Math.abs(v) > 40) { const alvo = v < 0 ? -LARG_DEL : LARG_DEL; row.style.transition = "transform .2s"; row.style.transform = `translateX(${alvo}px)`; swipeAberto = row; }
        else { row.style.transition = "transform .2s"; row.style.transform = "translateX(0)"; if (swipeAberto === row) swipeAberto = null; }
      }
      x0 = null;
    };
    row.addEventListener("pointerup", soltar); row.addEventListener("pointercancel", soltar);
    // clique: se acabou de deslizar ou está aberta, não abre a despesa (só fecha)
    w.addEventListener("click", e => {
      if (e.target.closest(".del-btn")) return;
      if (bloquearClique || swipeAberto === row) { e.stopPropagation(); e.preventDefault(); bloquearClique = false; if (swipeAberto === row) fecharSwipe(); }
    }, true);
  });
  document.querySelectorAll(".del-btn").forEach(b => b.addEventListener("click", () => excluirLanc(b.dataset.del, b.dataset.pend === "1")));
}
async function excluirLanc(id, pendente) {
  if (!confirm(t("confirm_del"))) { fecharSwipe(); return; }
  if (pendente) { const fila = lerFila().filter(p => !(p.corpo && p.corpo.id === id)); gravarFila(fila); S.pendentes = fila; toast(t("t_excl")); }
  else { try { await api("/api/excluir", {id}); await carregar(); toast(t("t_excl")); } catch { toast(t("t_sem_mac")); return; } }
  swipeAberto = null; render();
}

function olhosSenha() {   // botão mostrar/ocultar em todo campo de senha
  document.querySelectorAll("input[type=password]").forEach(inp => {
    const lab = inp.closest("label"); if (!lab || lab.querySelector(".olho")) return;
    lab.classList.add("tem-olho");
    const b = document.createElement("button"); b.type = "button"; b.className = "olho"; b.textContent = "👁"; b.setAttribute("aria-label", t("ver_senha")); b.title = t("ver_senha");
    b.addEventListener("click", () => { const ver = inp.type === "password"; inp.type = ver ? "text" : "password"; b.textContent = ver ? "🙈" : "👁"; inp.focus(); });
    lab.appendChild(b);
  });
}

  const filtro = document.getElementById("filtro");
  if (filtro) filtro.addEventListener("change", () => { S.filtro = filtro.value; render(); });
  const r = rota();
  if (r[0] === "job" && !r[2]) ligarSwipe();

    document.getElementById("tirar")?.addEventListener("click", () => document.getElementById("arquivo").click());

    d.addEventListener("input", () => { form.descricao = d.value; if (!form.itemManual) atualizarItem(); });
    document.getElementById("valor").addEventListener("input", e => { form.valor = e.target.value; recalcJob(r[1]); });
    document.getElementById("data").addEventListener("change", e => { form.data = e.target.value; });
    document.getElementById("receita-job").addEventListener("input", e => { form.receitaJob = e.target.value; recalcJob(r[1]); });
    document.querySelectorAll("[data-item]").forEach(c => c.addEventListener("click", () => { form.item = c.dataset.item; form.itemManual = true; render(); }));
    document.getElementById("novo-item").addEventListener("click", () => {
      const nome = (prompt(t("prompt_item")) || "").trim().slice(0, 60);
      if (nome) { form.extras.push(nome); form.item = nome; form.itemManual = true; render(); }
    });
    document.getElementById("salvar-despesa").addEventListener("click", () => salvarDespesa(r[1]));
    document.getElementById("excluir")?.addEventListener("click", async () => {
      if (!confirm(t("confirm_del"))) return;
      try { await api("/api/excluir", {id: form.id}); await carregar(); toast(t("t_excl")); ir("job/" + r[1]); }
      catch { toast(t("t_sem_mac")); }
    });
  }
  if (r[0] === "setup" || r[0] === "configuracao") ligarSetup(r[0] === "setup" ? r[1] : "base");
  if (r[0] === "novo-job" || (r[0] === "job" && r[2] === "editar")) {
    document.querySelectorAll("[data-passo]").forEach(b => b.addEventListener("click", () => {
      lerJobForm(); const k = b.dataset.passo; const v = (Number(form[k]) || 0) + Number(b.dataset.d);
      form[k] = Math.max(0, Math.min(k === "horas_dia" ? 24 : 999, Math.round(v * 2) / 2));
      if (k === "dias_work") form.diasWorkAuto = false;
      render();
    }));
    ["data_inicio", "data_fim"].forEach(id => document.getElementById(id)?.addEventListener("input", atualizarHoras));
    document.getElementById("dias_trab")?.addEventListener("input", () => { form.diasManual = true; atualizarHoras(); });
    pintarSq();
    document.getElementById("endereco").addEventListener("change", () => { lerJobForm(); if (form.endereco.trim() && !numero(form.sqft) && form.sqEnd !== form.endereco) buscarSqft(true); });
    ["endereco", "cidade"].forEach(id => document.getElementById(id)?.addEventListener("input", () => {
      lerJobForm();
      const dest = (form.endereco || form.cidade || "") + (form.endereco && !/\bMA\b/i.test(form.endereco) ? ", MA" : "");
      const vm = document.getElementById("ver-mapa"); if (vm) vm.href = `https://maps.apple.com/?saddr=${encodeURIComponent(S.config.base)}&daddr=${encodeURIComponent(dest)}&dirflg=d`;
    }));
    document.querySelectorAll("[data-status]").forEach(c => c.addEventListener("click", () => { lerJobForm(); form.status = c.dataset.status; render(); }));
    document.getElementById("salvar-job").addEventListener("click", salvarJob);
  }
}
